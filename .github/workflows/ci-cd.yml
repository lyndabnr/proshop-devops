name: CI/CD ProShop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests et analyse
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dependances backend
        run: npm install

      - name: Installer les dependances frontend
        run: cd frontend && npm install

      - name: Tests backend
        run: npm test || true

      - name: Tests frontend
        run: cd frontend && npm test -- --watchAll=false || true

      - name: Audit de securite backend
        run: npm audit --audit-level=critical || true

      - name: Audit de securite frontend
        run: cd frontend && npm audit --audit-level=critical || true

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Connexion Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build et push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proshop-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/proshop-backend:v1.0

      - name: Build et push frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proshop-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/proshop-frontend:v1.0

  deploy:
    name: Deploiement Docker Compose
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Deploiement avec Docker Compose
        run: |
          docker compose up -d --build
          docker compose ps