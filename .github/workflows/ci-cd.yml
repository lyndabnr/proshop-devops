name: CI/CD ProShop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests et analyse
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installer les dependances backend
        run: npm install

      - name: Installer les dependances frontend
        run: cd frontend && npm install

      - name: Tests backend
        run: npm test || true

      - name: Tests frontend
        run: cd frontend && npm test -- --watchAll=false || true

      - name: Audit de securite backend
        run: npm audit --audit-level=critical || true

      - name: Audit de securite frontend
        run: cd frontend && npm audit --audit-level=critical || true

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Build backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: proshop-backend:latest

      - name: Build frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: proshop-frontend:latest
  deploy:
    name: Deploiement Docker Compose
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v3

      - name: Verification Docker Compose
        run: docker compose config

      - name: Deployer avec Docker Compose
        run: docker compose up -d --build

      - name: Verifier les conteneurs
        run: docker ps