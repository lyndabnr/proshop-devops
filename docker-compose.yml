services:
  mongodb:
    image: mongo:6
    container_name: proshop-mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - proshop-network

  backend:
    image: proshop-backend
    container_name: proshop-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/proshop
      - JWT_SECRET=abc123secret
      - PAGINATION_LIMIT=8
    depends_on:
      - mongodb
    networks:
      - proshop-network

  frontend:
    image: proshop-frontend
    container_name: proshop-frontend
    restart: always
    networks:
      - proshop-network

  nginx:
    image: nginx:alpine
    container_name: proshop-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - proshop-network

volumes:
  mongo-data:

networks:
  proshop-network:
    driver: bridge